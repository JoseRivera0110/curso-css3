<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Gradientes</title>
</head>
<body>
    <h1 class="title">Gradientes y radial grandient</h1>
    <h2 class="title">Gradientes</h2>
    <h3 class="title">Posicionamiento</h3>
    <div class="container container-gradient">
        <div class="bg__size bg__gradient"></div>
    </div>
    <h3 class="title">Gradiante en base a los grados</h3>
    <img src="assets/images/grados.jpg" alt="" class="grados">
    <div class="container container-gradient">
        <div class="bg__size bg__gradient-grados"></div>
    </div>
    <h3 class="title">Gradiente en base a porcentajes</h3>
    <div class="container container-gradient">
        <div class="bg__size bg__gradient-porcent"></div>
        <h4 class="title">Gradiente solido</h4>
        <div class="bg__size bg__gradient-porcent-solid"></div>
    </div>
    <h2 class="title">Radial Gradient</h2>
    <h3 class="title">Composicion</h3>
    <div class="container">
        <div class="bg__size bg__radial_gradient"></div>
    </div>
    <h3 class="title">Palabras clave</h3>
    <div class="container">
        <div class="bg__size bg__radial_gradient-position"></div>
    </div>
</body>
</html>
