<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Background</title>
</head>
<body>
    <h1 class="title">Background</h1>
    
    <h2 class="title">Background color</h2>
    <div class="container">
        <div class="bg__color">Soy un background-color: azul</div>
    </div>
    <h2 class="title">Background image</h2>
    <div class="container">
        <div class="bg__image"></div>
    </div>
    <h2 class="title">Background attachment</h2>
    <div class="container">
        <div class="bg__attachment"></div>
    </div>
    <h2 class="title">Background size</h2>
    <div class="container">
        <div class="bg__size"></div>
    </div>
    <h2 class="title">Background repeat</h2>
    <div class="container">
        <div class="bg__repeat"></div>
    </div>
    <h2 class="title">Background position</h2>
    <div class="container-position">
        <div class="bg__position"></div>
    </div>
    <h2 class="title">Background Origin</h2>
    <div class="container">
        <div class="bg__origin"></div>
    </div>
    
     <h2 class="title">Background clip</h2>
    <div class="container">
        <div class="bg__clip"></div>
    </div>
